# ArgoCD Applications — apply com:
#   kubectl apply -f application.yaml
#
# Cobre:
#   - manifestos/                                  (namespace, Prometheus CR, OTel Collector, Instrumentation, Gateway)
#   - helm/                                        (values dos charts: kube-prometheus-stack, otel-operator, tempo, grafana)
#   - app/azure-voting-app-dotnet/kubernetes-manifests/  (azure-vote app + redis)
---
# kube-prometheus-stack (apenas o Operator + CRDs)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/prometheus-community/charts
      chart: kube-prometheus-stack
      targetRevision: 88.5.2
      helm:
        valueFiles:
          - $values/helm/values-kube-prometheus-stack.yaml
    - repoURL: git@github.com:gustavomkunolinx/labs
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# cert-manager (dependência do webhook do OTel Operator)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      parameters:
        - name: crds.enabled
          value: "true"
        - name: startupapicheck.timeout
          value: 5m
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
