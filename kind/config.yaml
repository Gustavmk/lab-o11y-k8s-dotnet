# kind-3nodes.yaml
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # Must match your Service's nodePort
        hostPort: 80           # HTTP port exposed on your WSL host / Windows localhost
        protocol: TCP
  - role: worker
  - role: worker