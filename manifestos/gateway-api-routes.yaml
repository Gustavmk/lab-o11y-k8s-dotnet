---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-api-resources
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway # gateway-ingress
  namespace: gateway-api-resources
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
  - name: default
    hostname: "*.kubernetes.docker.internal"
    port: 8080
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All

# Esse Service do tipo NodePort expõe o pod do Envoy (que implementa o Gateway) para fora do cluster Kind:
# 
# port: 80 — porta do cluster (ClusterIP). Outros pods acessariam via :80.
# targetPort: 8080 — porta onde o container Envoy escuta (o listener do Gateway definido acima).
# nodePort: 30080 — porta exposta no node (a VM do Kind). Acesso externo via <node-IP>:3008
#
# O mesmo padrão se repete para HTTPS: 443 → 8443, exposto em 30443.
#
# Por que é necessário? O cloud-provider-kind não cria um LoadBalancer real — ele usa esse NodePort para rotear o tráfego do host até o Envoy dentro do cluster. O cloud-provider-kind container rodando no Docker então faz o bridge entre *.kubernetes.docker.internal e o node Kind.