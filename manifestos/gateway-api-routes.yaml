---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-api-resources
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway # gateway-ingress
  namespace: gateway-api-resources
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
  - name: default
    hostname: "*.kubernetes.docker.internal"
    port: 8080
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
